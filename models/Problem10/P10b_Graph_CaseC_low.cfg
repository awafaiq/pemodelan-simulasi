# ======================================================================
# No. 10(b) | Case C: All random | low-frequency failures (TTF 1000 min, TTR 50 min)
# Policy: RESUME (part continues its remaining processing time after repair)
# Banks Ch.13 Example 1 | v4: failures on CALENDAR time for every soal
# Failure loop: a single Token cycles Up (TTF) -> close MachineUp -> Repair (TTR) -> open MachineUp.
# TTF is counted from the END of the previous repair, so % down = TTR/(TTF+TTR) = 4.76%.
# The machine can fail while idle; parts arriving during a repair wait in Q1.
# ======================================================================

Define ExponentialDistribution { ArrExp SvcExp TTF TTR }
Define SimEntity { Part Token }
Define EntityGenerator { Gen FailGen }
Define Queue { Q1 QUp QRep }
Define Server { Machine Up Repair }
Define Assign { MarkFail }
Define EntitySignal { SigDown SigUp }
Define SignalThreshold { MachineUp }
Define Statistics { SvcStat DownHit }
Define Branch { HitChk }
Define EntitySink { Out }
Define Graph { QGraph }
Define ExpressionLogger { QLog }

# ---------- Input distributions (seeds kept from the v3 files) ----------
ArrExp UnitType { TimeUnit }
ArrExp RandomSeed { 1 }
ArrExp Mean { 10 min }
SvcExp UnitType { TimeUnit }
SvcExp RandomSeed { 2 }
SvcExp Mean { 7.5 min }
TTF UnitType { TimeUnit }
TTF RandomSeed { 4 }
TTF Mean { 1000 min }
TTR UnitType { TimeUnit }
TTR RandomSeed { 5 }
TTR Mean { 50 min }

# ---------- Part flow ----------
Part AttributeDefinitionList { { tStart 0[min] } { started 0 } }
Gen PrototypeEntity { Part }
Gen FirstArrivalTime { ArrExp }
Gen InterArrivalTime { ArrExp }
Gen NextComponent { Q1 }

Machine WaitQueue { Q1 }
Machine ServiceTime { SvcExp }
# tStart = time the part FIRST started processing (kept on restart).
Machine AssignmentsAtStart { { 'this.obj.tStart = this.obj.started == 1 ? this.obj.tStart : simTime' } { 'this.obj.started = 1' } }
# Immediate threshold: work stops when MachineUp closes and the REMAINDER is completed after it re-opens.
Machine ImmediateThresholdList { MachineUp }
Machine NextComponent { SvcStat }

# SvcStat: time to complete service = from first start of processing to completion (incl. downtime).
SvcStat UnitType { TimeUnit }
SvcStat SampleValue { 'simTime - this.obj.tStart' }
SvcStat NextComponent { Out }

# ---------- Failure loop (calendar time) ----------
MachineUp InitialState { TRUE }
Token AttributeDefinitionList { { hit 0 } { tFail 0[min] } }
FailGen PrototypeEntity { Token }
FailGen FirstArrivalTime { 0 min }
FailGen InterArrivalTime { 1 min }
FailGen MaxNumber { 1 }
FailGen NextComponent { QUp }
Up WaitQueue { QUp }
Up ServiceTime { TTF }
Up NextComponent { MarkFail }
# hit = 1 if a part is on the machine at the moment of failure.
MarkFail AttributeAssignmentList { { 'this.obj.hit = [Machine].NumberInProgress' } { 'this.obj.tFail = simTime' } }
MarkFail NextComponent { SigDown }
SigDown TargetSignalThreshold { MachineUp }
SigDown NewState { FALSE }
SigDown NextComponent { QRep }
Repair WaitQueue { QRep }
Repair ServiceTime { TTR }
Repair NextComponent { HitChk }
HitChk NextComponentList { DownHit SigUp }
HitChk Choice { 'this.obj.hit > 0 ? 1 : 2' }
# DownHit: one sample per downtime experienced by a part (value = repair duration).
DownHit UnitType { TimeUnit }
DownHit SampleValue { 'simTime - this.obj.tFail' }
DownHit NextComponent { SigUp }
SigUp TargetSignalThreshold { MachineUp }
SigUp NewState { TRUE }
SigUp NextComponent { QUp }

Part Position { 0 1.5 0 m }
Gen Position { 0 0 0 m }
Q1 Position { 2 0 0 m }
Machine Position { 4 0 0 m }
SvcStat Position { 6 0 0 m }
Out Position { 8 0 0 m }
Token Position { 0 -4.5 0 m }
FailGen Position { 0 -3 0 m }
QUp Position { 2 -3 0 m }
Up Position { 4 -3 0 m }
MarkFail Position { 6 -3 0 m }
SigDown Position { 8 -3 0 m }
QRep Position { 8 -5 0 m }
Repair Position { 6 -5 0 m }
HitChk Position { 4 -5 0 m }
DownHit Position { 2 -6.5 0 m }
SigUp Position { 2 -5 0 m }
MachineUp Position { 4 -1.5 0 m }

# Graph: queue length (left axis) and machine-down indicator (right axis, 1 = down).
QGraph Position { 5 4.5 0 m }
QGraph Size { 10 4 0 m }
QGraph NumberOfPoints { 1000 }
QGraph DataSource { { [Q1].QueueLength } }
QGraph SecondaryDataSource { { '[MachineUp].Open ? 0 : 1' } }
QGraph XAxisStart { -5000 min }
QGraph XAxisEnd { 0 min }
QGraph XAxisInterval { 1000 min }
QGraph YAxisStart { 0 }
QGraph YAxisEnd { 25 }
QGraph YAxisInterval { 5 }
QGraph SecondaryYAxisStart { 0 }
QGraph SecondaryYAxisEnd { 1 }
QGraph SecondaryYAxisInterval { 1 }

# QLog writes queue length and machine state every minute to <file>-QLog.log (open in Excel).
QLog Interval { 1 min }
QLog DataSource { { [Q1].QueueLength } { '[MachineUp].Open ? 0 : 1' } }
QLog Position { 10 -1.5 0 m }

Define View { View1 }
View1 ShowWindow { TRUE }
View1 ViewCenter { 5 -2 0 m }
View1 ViewPosition { 5 -2 24 m }

Simulation RunDuration { 10000 min }
Simulation NumberOfReplications { 1 }
# Columns: Lq | Wq (min) | parts done | fraction of time down | failures | downtimes experienced by parts | downtimes per part | avg duration of downtime experienced (min) | avg time to complete service (min) | throughput (parts/h)
Simulation RunOutputList { { '[Q1].QueueLengthAverage' } { '[Q1].AverageQueueTime / 1[min]' } { '[Out].NumberAdded' } { '[MachineUp].ClosedFraction' } { '[Repair].NumberProcessed' } { '[DownHit].NumberProcessed' } { '[DownHit].NumberProcessed / ( [Out].NumberAdded )' } { '[DownHit].SampleAverage / 1[min]' } { '[SvcStat].SampleAverage / 1[min]' } { '[Out].NumberAdded / ( 10000[min] / 1[h] )' } }

RecordEdits

Define DisplayEntity { XY-Grid }


# *** GRAPHICS INPUTS ***

Simulation RealTime { FALSE }
Simulation RealTimeFactor { 300 }
Simulation ShowLabels { TRUE }
Simulation ShowSubModels { TRUE }
Simulation ShowInputEditor { TRUE }

