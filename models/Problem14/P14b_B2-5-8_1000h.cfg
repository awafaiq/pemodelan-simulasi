Room1 Position { 6 1.5 0 m }
Room2 Position { 10.5 1.5 0 m }
Room3 Position { 15 1.5 0 m }

Define View { View1 }
View1 ShowWindow { TRUE }
View1 ViewCenter { 9.75 -1 0 m }
View1 ViewPosition { 9.75 -1 30 m }

Simulation RunDuration { 60000 min }
Simulation NumberOfReplications { 5 }
Simulation RunOutputList { { [Out].NumberAdded } { [ScrapSink].NumberAdded } { [QB1].QueueLengthAverage } { [QB2].QueueLengthAverage } { [QB3].QueueLengthAverage } { [Shear].WorkingTime } { [Punch].WorkingTime } { [Form].WorkingTime } { [Bend].WorkingTime } }
# Full state times (Working / Breakdown / Maintenance = die change / Idle / Stopped = blocked) per press:
Simulation PrintReport { TRUE }

RecordEdits


