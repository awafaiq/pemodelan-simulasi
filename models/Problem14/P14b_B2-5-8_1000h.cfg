# ============================================================
# No. 14(b) | Finite buffers B1=2, B2=5, B3=8 | 1000 h x 5 replications
# Banks Ch.13 Exercise 14 - 4-press serial line (Shear, Punch, Form, Bend)
# Time unit: minutes. Processing constant; failures exp (operating time);
# repair Uniform(mean +/- 5); die change 25 min after N sheets (= N/rate operating minutes);
# 20% of the sheet in process scrapped on failure (Branch after each press).
# ============================================================

Define ExponentialDistribution { TTF_S TTF_P TTF_F TTF_B }
Define UniformDistribution { TTR_S TTR_P TTR_F TTR_B U_S U_P U_F U_B }
Define SimEntity { Sheet }
Define EntityGenerator { Gen }
Define ExpressionThreshold { SupplyOK }
Define Queue { QS QB1 QB2 QB3 }
Define Server { Shear Punch Form Bend }
Define DowntimeEntity { Fail_S Die_S Fail_P Die_P Fail_F Die_F Fail_B Die_B }
Define Branch { Sc_S Sc_P Sc_F Sc_B }
Define EntitySink { Out ScrapSink }
Define ExpressionThreshold { Room1 Room2 Room3 }

TTF_S UnitType { TimeUnit }
TTF_S RandomSeed { 1 }
TTF_S Mean { 100 min }
TTR_S UnitType { TimeUnit }
TTR_S RandomSeed { 2 }
TTR_S MinValue { 3 min }
TTR_S MaxValue { 13 min }
U_S UnitType { DimensionlessUnit }
U_S RandomSeed { 3 }
U_S MinValue { 0 }
U_S MaxValue { 1 }
TTF_P UnitType { TimeUnit }
TTF_P RandomSeed { 4 }
TTF_P Mean { 90 min }
TTR_P UnitType { TimeUnit }
TTR_P RandomSeed { 5 }
TTR_P MinValue { 5 min }
TTR_P MaxValue { 15 min }
U_P UnitType { DimensionlessUnit }
U_P RandomSeed { 6 }
U_P MinValue { 0 }
U_P MaxValue { 1 }
TTF_F UnitType { TimeUnit }
TTF_F RandomSeed { 7 }
TTF_F Mean { 180 min }
TTR_F UnitType { TimeUnit }
TTR_F RandomSeed { 8 }
TTR_F MinValue { 4 min }
TTR_F MaxValue { 14 min }
U_F UnitType { DimensionlessUnit }
U_F RandomSeed { 9 }
U_F MinValue { 0 }
U_F MaxValue { 1 }
TTF_B UnitType { TimeUnit }
TTF_B RandomSeed { 10 }
TTF_B Mean { 240 min }
TTR_B UnitType { TimeUnit }
TTR_B RandomSeed { 11 }
TTR_B MinValue { 15 min }
TTR_B MaxValue { 25 min }
U_B UnitType { DimensionlessUnit }
U_B RandomSeed { 12 }
U_B MinValue { 0 }
U_B MaxValue { 1 }

# Unlimited supply in front of Shear: keep a few sheets in QS at all times.
SupplyOK OpenCondition { '[QS].QueueLength < 3' }
Gen PrototypeEntity { Sheet }
Gen FirstArrivalTime { 0 min }
Gen InterArrivalTime { 0.01 min }
Gen OperatingThresholdList { SupplyOK }
Gen NextComponent { QS }

# ---- Shear: 4.5/min -> 0.222222 min/sheet; MTTF 100; TTR U(3,13); die change every 500 sheets = 111.1111 operating min
Shear WaitQueue { QS }
Shear ServiceTime { 0.222222 min }
Shear NextComponent { Sc_S }
Shear ImmediateBreakdownList { Fail_S }
Shear ForcedMaintenanceList { Die_S }
Fail_S IntervalWorkingEntity { Shear }
Fail_S FirstDowntime { TTF_S }
Fail_S Interval { TTF_S }
Fail_S Duration { TTR_S }
Die_S IntervalWorkingEntity { Shear }
Die_S FirstDowntime { 111.1111 min }
Die_S Interval { 111.1111 min }
Die_S Duration { 25 min }
# scrap probability per sheet = 0.2 x P(failure during one sheet) = 0.2 x 0.222222/100 = 0.000444
Sc_S NextComponentList { ScrapSink QB1 }
Sc_S Choice { '[U_S].Value < 0.000444 ? 1 : 2' }

# ---- Punch: 5.5/min -> 0.181818 min/sheet; MTTF 90; TTR U(5,15); die change every 400 sheets = 72.7273 operating min
Punch WaitQueue { QB1 }
Punch ServiceTime { 0.181818 min }
Punch NextComponent { Sc_P }
Punch ImmediateBreakdownList { Fail_P }
Punch ForcedMaintenanceList { Die_P }
Fail_P IntervalWorkingEntity { Punch }
Fail_P FirstDowntime { TTF_P }
Fail_P Interval { TTF_P }
Fail_P Duration { TTR_P }
Die_P IntervalWorkingEntity { Punch }
Die_P FirstDowntime { 72.7273 min }
Die_P Interval { 72.7273 min }
Die_P Duration { 25 min }
# scrap probability per sheet = 0.2 x P(failure during one sheet) = 0.2 x 0.181818/90 = 0.000404
Sc_P NextComponentList { ScrapSink QB2 }
Sc_P Choice { '[U_P].Value < 0.000404 ? 1 : 2' }

# ---- Form: 3.8/min -> 0.263158 min/sheet; MTTF 180; TTR U(4,14); die change every 750 sheets = 197.3684 operating min
Form WaitQueue { QB2 }
Form ServiceTime { 0.263158 min }
Form NextComponent { Sc_F }
Form ImmediateBreakdownList { Fail_F }
Form ForcedMaintenanceList { Die_F }
Fail_F IntervalWorkingEntity { Form }
Fail_F FirstDowntime { TTF_F }
Fail_F Interval { TTF_F }
Fail_F Duration { TTR_F }
Die_F IntervalWorkingEntity { Form }
Die_F FirstDowntime { 197.3684 min }
Die_F Interval { 197.3684 min }
Die_F Duration { 25 min }
# scrap probability per sheet = 0.2 x P(failure during one sheet) = 0.2 x 0.263158/180 = 0.000292
Sc_F NextComponentList { ScrapSink QB3 }
Sc_F Choice { '[U_F].Value < 0.000292 ? 1 : 2' }

# ---- Bend: 3.2/min -> 0.3125 min/sheet; MTTF 240; TTR U(15,25); die change every 600 sheets = 187.5 operating min
Bend WaitQueue { QB3 }
Bend ServiceTime { 0.3125 min }
Bend NextComponent { Sc_B }
Bend ImmediateBreakdownList { Fail_B }
Bend ForcedMaintenanceList { Die_B }
Fail_B IntervalWorkingEntity { Bend }
Fail_B FirstDowntime { TTF_B }
Fail_B Interval { TTF_B }
Fail_B Duration { TTR_B }
Die_B IntervalWorkingEntity { Bend }
Die_B FirstDowntime { 187.5 min }
Die_B Interval { 187.5 min }
Die_B Duration { 25 min }
# scrap probability per sheet = 0.2 x P(failure during one sheet) = 0.2 x 0.3125/240 = 0.00026
Sc_B NextComponentList { ScrapSink Out }
Sc_B Choice { '[U_B].Value < 0.00026 ? 1 : 2' }

# ---- Finite buffers with blocking: buffer sizes B1=2, B2=5, B3=8 (total 15).
# A press may start a sheet only while its downstream queue holds <= B sheets ("< B + 1").
# The (B+1)-th sheet in the queue is the finished sheet that would be stuck in the press
# (blocking after service), so this reproduces the book's blocking rule exactly.
Room1 OpenCondition { '[QB1].QueueLength < 3' }
Room2 OpenCondition { '[QB2].QueueLength < 6' }
Room3 OpenCondition { '[QB3].QueueLength < 9' }
Shear OperatingThresholdList { Room1 }
Punch OperatingThresholdList { Room2 }
Form OperatingThresholdList { Room3 }

Sheet Position { 0 1 0 m }
Gen Position { 0 0 0 m }
QS Position { 1.5 0 0 m }
